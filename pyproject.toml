# uv workspace configuration for tiros-engine
# https://docs.astral.sh/uv/
#
# Python tooling and scripts for the tiros-engine project.
# Run `uv sync` to install dependencies.

[project]
name = "tiros-engine"
version = "0.1.0"
description = "Python tooling for tiros-engine Kafka-compatible streaming platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "PreciseTarget Labs" }]
keywords = ["kafka", "streaming", "s3", "tansu"]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
kafka = [
    "aiokafka>=0.11",
    "confluent-kafka>=2.6",
]
data = [
    "polars>=1.0",
    "pyarrow>=18.0",
    "deltalake>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv.workspace]
members = ["scripts/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
